<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee4">
  <meta name="description" content="Site, agendamento e redes sociais do Dr. Jarbas Magalhães, ginecologista em Mogi Mirim.">
  <title>Dr. Jarbas Magalhães | Canais oficiais</title>
  <style>
    @font-face {
      font-family: Newsreader;
      src: url("../0aa0ffe3a23ad8fb3576.woff2") format("woff2");
      font-weight: 300 400;
      font-display: swap;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../713ca32c3c8b2ada804c.woff2") format("woff2");
      font-weight: 300 600;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --petrol: #0d4645;
      --deep: #073635;
      --ink: #153a39;
      --cream: #f3eee4;
      --sand: #ded2bf;
      --white: #fffdf8;
      --copper: #946452;
      --line: #bdccc5;
      --muted: #4d6560;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 22px 16px;
      background: var(--cream);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      line-height: 1.35;
    }
    main {
      width: min(100%, 29rem);
      padding: 21px clamp(15px, 5vw, 28px) 23px;
      border: 1px solid var(--sand);
      border-top: 3px solid var(--petrol);
      border-radius: 16px;
      background: var(--white);
    }
    header { text-align: center; }
    .portrait {
      display: block;
      width: 112px;
      height: auto;
      margin: 0 auto 14px;
      padding: 4px;
      border: 1px solid var(--sand);
      border-radius: 58px 58px 14px 14px;
    }
    .specialty {
      margin: 0 0 7px;
      color: var(--copper);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Newsreader, Georgia, serif;
      font-size: clamp(27px, 8.2vw, 41px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .credentials {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .75rem;
    }
    nav { margin-top: 21px; }
    ul {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .primary-links { margin-bottom: 12px; }
    .social-links {
      border-top: 1px solid var(--sand);
      padding-top: 12px;
    }
    .card {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 16px;
      gap: 11px;
      align-items: center;
      min-height: 46px;
      padding: 6px 12px;
      border: 1px solid var(--sand);
      border-radius: 9px;
      color: var(--ink);
      font-size: .9375rem;
      font-weight: 500;
      text-decoration: none;
    }
    .card:hover { background: var(--cream); }
    .card:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 2px;
    }
    .primary-links .card {
      min-height: 54px;
      border-color: var(--line);
      font-weight: 600;
    }
    .primary-links .appointment {
      border-color: var(--petrol);
      background: var(--petrol);
      color: var(--white);
    }
    .primary-links .appointment:hover { background: var(--deep); }
    .badge {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--cream);
      color: var(--petrol);
    }
    .appointment .badge {
      background: #27605e;
      color: var(--white);
    }
    .badge svg { width: 17px; height: 17px; }
    .arrow {
      width: 14px;
      height: 14px;
      color: var(--muted);
    }
    .appointment .arrow { color: inherit; }
    .hint {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 400;
    }
    .appointment .hint { color: #e1ebe6; }
    @media (min-width: 600px) and (min-height: 680px) {
      main { padding-block: 29px; }
      .portrait { width: 126px; }
    }
    @media (max-height: 600px) {
      body { padding-block: 12px; }
      main { padding-block: 13px; }
      .portrait { width: 86px; margin-bottom: 10px; }
      nav { margin-top: 14px; }
    }
  </style>
</head>
